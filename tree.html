<!DOCTYPE html>
<html lang="en">
<head>
    	<meta charset="UTF-8">
	<title>The Lynx School</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Shelly - Website" />
	<meta name="author" content="merkulove">
	<meta name="keywords" content="" />
	<link rel="icon" href="assets/img/lnxlogo-removebg-preview-icon.png">
	<link rel="stylesheet" type="text/css" href="assets/css/animate.css">
	<link rel="stylesheet" type="text/css" href="assets/css/bootstrap.min.css">
	<link rel="stylesheet" type="text/css" href="assets/css/font-awesome.min.css">
	<link rel="stylesheet" type="text/css" href="assets/css/main.css">
	<link rel="stylesheet" type="text/css" href="assets/css/responsive.css">
	<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">

    <style>

        .container {
            max-width: 1400px;
            position: relative;
            z-index: 2;
        }

        /* Main School Node */
        .main-school {
            color: white;
            padding: 20px 40px;
            border-radius: 15px;
            margin-bottom: 50px;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .main-school h1 {
            font-size: 2.2rem;
            font-weight: bold;
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        /* Network Headers */
        .network-header {
            color: white;
            padding: 15px 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            text-align: center;
            transition: transform 0.3s ease;
            position: relative;
            z-index: 10;
        }

        .network-header:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        .network-header h2 {
            font-size: 1.4rem;
            margin: 0;
            font-weight: 600;
        }

        /* Branch Cards */
        .branch-card {
            background: white;
            border-radius: 10px;
            padding: 18px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            height: 100%;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            margin-bottom: 20px;
            position: relative;
            z-index: 10;
        }

        .branch-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 35px rgba(0,0,0,0.2);
            border-color: #667eea;
        }

        .branch-title {
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
            padding-bottom: 8px;
            line-height: 1.3;
        }

        .contact-info {
            margin-bottom: 15px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            color: #5a6c7d;
            font-size: 0.9rem;
        }

        .contact-item i {
            width: 20px;
            color: #667eea;
            margin-right: 8px;
            font-size: 0.9rem;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
            padding-top: 12px;
            border-top: 1px solid #ecf0f1;
        }

        .social-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.3s ease;
            color: white;
            font-size: 0.8rem;
        }

        .social-icon.facebook { background: #3b5998; }
        .social-icon.instagram { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
        .social-icon.twitter { background: #1da1f2; }
        .social-icon.linkedin { background: #0077b5; }

        .social-icon:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        /* SVG for connecting lines */
        .tree-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* SVG styles for lines */
        .connection-line {
            stroke: #e70e0e;
            stroke-width: 3;
            fill: none;
            opacity: 0.8;
        }

        .connection-dot {
            fill: #f09433;
            opacity: 0.9;
        }

        .row{
            row-gap: 25px;
        }

        /* Responsive adjustments */
        @media (max-width: 767px) {
            .main-school {
                padding: 15px 25px;
                margin-bottom: 30px;
            }
            
            .main-school h1 {
                font-size: 1.8rem;
            }
            
            .network-header {
                padding: 12px 20px;
                margin-bottom: 20px;
            }
            
            .network-header h2 {
                font-size: 1.2rem;
            }
            
            .branch-card {
                padding: 15px;
            }
            
            .branch-title {
                font-size: 1rem;
            }
            
            .contact-item {
                font-size: 0.8rem;
            }
            
            .social-icon {
                width: 28px;
                height: 28px;
                font-size: 0.7rem;
            }
        }
        .node-logo{
            text-align: center;
            padding-bottom: 14px;
        }
        .node-logo img {
    border-radius: 150px;
    width: 170px;
}
    </style>
</head>
<body>
    <!-- SVG for connecting lines -->
    <svg class="tree-lines" id="tree-lines">
        <!-- Lines will be drawn here by JavaScript -->
    </svg>

    <div class="container" id="tree-container">
  <!-- Main School Header -->
  <div class="row justify-content-center">
    <div class="col-12 text-center">
      <div class="main-school" id="main-school">
        <div class=" node-card">
            <div class="node-logo">
              <img src="./assets/img/img/5.png" alt="Lynx Campus F-7">
            </div>
            <h4 class="node-title branch-title">THE LYNX HEAD OFFICE</h4>
          </div>
      </div>
    </div>
  </div>

  <!-- Main Networks Row -->
  <div class="row">
    <!-- Rawalpindi Network Column -->
    <div class="col-lg-6">
      <div class="network-header" id="rawalpindi-network">
        <div class=" node-card">
            <div class="node-logo">
              <img src="./assets/img/img/5.png" alt="Lynx Campus F-7">
            </div>
            <h4 class="node-title branch-title">RAWALPINDI NETWORK</h4>
          </div>
      </div>
      
      <!-- Rawalpindi Branches - 2x2 Grid -->
      <div class="row" id="rawalpindi-branches">
        <div class="col-md-6">
          <div class=" node-card" id="branch-r1">
            <div class="node-logo">
              <img src="./assets/img/img/5.png" alt="Lynx Campus Satellite Town">
            </div>
            <h4 class="node-title branch-title">Lynx Campus <br> Satellite Town</h4>
          </div>
        </div>
        <div class="col-md-6">
          <div class=" node-card" id="branch-r2">
            <div class="node-logo">
              <img src="./assets/img/img/5.png" alt="Lynx Campus Bahria Town">
            </div>
            <h4 class="node-title branch-title">Lynx Campus <br> Bahria Town</h4>
          </div>
        </div>
        <div class="col-md-6">
          <div class=" node-card" id="branch-r3">
            <div class="node-logo">
              <img src="./assets/img/img/5.png" alt="Lynx Campus DHA">
            </div>
            <h4 class="node-title branch-title">Lynx Campus <br> DHA</h4>
          </div>
        </div>
        <div class="col-md-6">
          <div class=" node-card" id="branch-r4">
            <div class="node-logo">
              <img src="./assets/img/img/5.png" alt="Lynx Campus Westridge">
            </div>
            <h4 class="node-title branch-title">Lynx Campus <br> Westridge</h4>
          </div>
        </div>
      </div>
    </div>

    <!-- Islamabad Network Column -->
    <div class="col-lg-6">
      <div class="network-header" id="islamabad-network">
        <div class=" node-card">
            <div class="node-logo">
              <img src="./assets/img/img/5.png" alt="Lynx Campus F-7">
            </div>
            <h4 class="node-title branch-title">ISLAMABAD NETWORK</h4>
          </div>
      </div>
      
      <!-- Islamabad Branches - 1x2 Grid -->
      <div class="row" id="islamabad-branches">
        <div class="col-md-6">
          <div class=" node-card" id="branch-i1">
            <div class="node-logo">
              <img src="./assets/img/img/5.png" alt="Lynx Campus F-7">
            </div>
            <h4 class="node-title branch-title">Lynx Campus <br> F-7</h4>
          </div>
        </div>
        <div class="col-md-6">
          <div class=" node-card" id="branch-i2">
            <div class="node-logo">
              <img src="./assets/img/img/5.png" alt="Lynx Campus G-9">
            </div>
            <h4 class="node-title branch-title">Lynx Campus <br> G‑9</h4>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
<script>
  function drawConnectingLines() {
    const containerEl = document.getElementById('tree-container');
    const containerRect = containerEl.getBoundingClientRect();
    const svg = document.getElementById('tree-lines');
    svg.innerHTML = '';

    // Set SVG viewport to match container
    const width = containerRect.width;
    const height = containerRect.height;
    svg.setAttribute('width', width);
    svg.setAttribute('height', height);
    svg.setAttribute('viewBox', `0 0 ${width} ${height}`);

    // Convert page coords → SVG coords
    const toSVG = (x, y) => ({ x: x - containerRect.left, y: y - containerRect.top });

    // Creators
    const makeLine = (x1, y1, x2, y2) => {
      const l = document.createElementNS('http://www.w3.org/2000/svg','line');
      l.setAttribute('x1', x1);
      l.setAttribute('y1', y1);
      l.setAttribute('x2', x2);
      l.setAttribute('y2', y2);
      l.setAttribute('class', 'connection-line');
      return l;
    };
    const makeDot = (x, y, r=4) => {
      const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
      c.setAttribute('cx', x);
      c.setAttribute('cy', y);
      c.setAttribute('r', r);
      c.setAttribute('class', 'connection-dot');
      return c;
    };
    const drawBranch = (fromEl, toRect) => {
      const f = fromEl.getBoundingClientRect();
      const start = toSVG(f.left + f.width/2, f.bottom);
      const end   = toSVG(toRect.left + toRect.width/2, toRect.top);
      const midY  = start.y + (end.y - start.y)/2;

      const p = document.createElementNS('http://www.w3.org/2000/svg','path');
      p.setAttribute('d', `M ${start.x} ${start.y} L ${start.x} ${midY} L ${end.x} ${midY} L ${end.x} ${end.y}`);
      p.setAttribute('class', 'connection-line');
      svg.appendChild(p);
      svg.appendChild(makeDot(start.x, midY, 3));
      svg.appendChild(makeDot(end.x,   midY, 3));
    };

    const isMobile = window.innerWidth <= 991;

    // Main → Networks
    const mainRect = document.getElementById('main-school').getBoundingClientRect();
    const rawHdr   = document.getElementById('rawalpindi-network').getBoundingClientRect();
    const islHdr   = document.getElementById('islamabad-network').getBoundingClientRect();

    if (isMobile) {
      const m = toSVG(mainRect.left + mainRect.width/2, mainRect.bottom);
      const r = toSVG(rawHdr.left  + rawHdr.width/2,  rawHdr.top);
      const i = toSVG(islHdr.left  + islHdr.width/2,  islHdr.top);
      svg.appendChild(makeLine(m.x, m.y, r.x, r.y));
      svg.appendChild(makeLine(m.x, m.y, i.x, i.y));
    } else {
      const m = toSVG(mainRect.left + mainRect.width/2, mainRect.bottom);
      const r = toSVG(rawHdr.left  + rawHdr.width/2,  rawHdr.top);
      const i = toSVG(islHdr.left  + islHdr.width/2,  islHdr.top);
      const midY = m.y + (r.y - m.y)/2;
      svg.appendChild(makeLine(m.x, m.y, m.x, midY));
      svg.appendChild(makeLine(r.x, midY,  i.x, midY));
      svg.appendChild(makeLine(r.x, midY,  r.x, r.y));
      svg.appendChild(makeLine(i.x, midY,  i.x, i.y));
      [m.x, r.x, i.x].forEach(x => svg.appendChild(makeDot(x, midY)));
    }

    // Rawalpindi → r1,r2
    ['r1','r2'].forEach(id => {
      const hdr = document.getElementById('rawalpindi-network');
      const br  = document.getElementById(`branch-${id}`).getBoundingClientRect();
      drawBranch(hdr, br);
    });
    // r1→r3, r2→r4
    drawBranch(
      document.getElementById('branch-r1'),
      document.getElementById('branch-r3').getBoundingClientRect()
    );
    drawBranch(
      document.getElementById('branch-r2'),
      document.getElementById('branch-r4').getBoundingClientRect()
    );

    // Islamabad → i1,i2
    ['i1','i2'].forEach(id => {
      const hdr = document.getElementById('islamabad-network');
      const br  = document.getElementById(`branch-${id}`).getBoundingClientRect();
      drawBranch(hdr, br);
    });
  }

  window.addEventListener('load', drawConnectingLines);
  window.addEventListener('resize', () => {
    clearTimeout(window._resizeTimer);
    window._resizeTimer = setTimeout(drawConnectingLines, 200);
  });
</script>


</body>
</html>
